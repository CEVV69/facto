<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Facto</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Facto">
<style>
:root{--bg:#0b0d12;--surf:#141821;--line:#222936;--txt:#e8ecf3;--mut:#8a94a6;--acc:#2f7cf6;--red:#ef4444;--ok:#22c55e;--mid:#f59e0b;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.tr,.facto p,.claim{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{display:block}

/* Acceso */
.gate{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.gate img{width:96px;height:96px;border-radius:22px}
.gate h1{margin:4px 0 0;font-size:28px;letter-spacing:-.5px}
.gate p{margin:0;color:var(--mut)}
.gate form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.gate input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--txt);padding:0 16px;font-size:17px;text-align:center;outline:none}
.gate input:focus{border-color:var(--acc)}
.gate .go{height:50px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600}
.gate .go:disabled{opacity:.5}
.gate .err{min-height:20px;color:var(--red);font-size:14px}

/* App */
#app{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
header img{width:28px;height:28px;border-radius:7px}
header b{font-size:18px;letter-spacing:-.3px;flex:1}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mut)}
.ib:active{background:var(--surf)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 24px}
.empty{color:var(--mut);text-align:center;padding:64px 24px}
.empty svg{margin:0 auto 14px;opacity:.5}

.sess{margin:0 0 18px}
.sh{display:flex;align-items:center;gap:8px;min-height:44px}
.st{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;flex:1}
.live .st{color:var(--red)}
.live .st::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;animation:blink 1.2s infinite}
.tr{margin:0 0 10px;color:var(--mut);font-size:14px;max-height:3.1em;overflow:hidden;cursor:pointer;
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.tr.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.tr:empty{display:none}
.cards{display:flex;flex-direction:column;gap:10px}
.sess:not(.live) .cards:empty::after{content:"Sin datos verificables";color:var(--mut);font-size:14px;padding:4px 0}
.sess.mute .cards:empty::after{content:"No se captó audio"}

.card{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px 44px 14px 14px}
.card .x{position:absolute;top:4px;right:2px;width:44px;height:44px;display:grid;place-items:center;color:var(--mut)}
.claim{margin:0 0 10px;font-size:15px;color:var(--mut);font-style:italic}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:10px}
.v-ok{background:rgba(34,197,94,.15);color:var(--ok)}
.v-bad{background:rgba(239,68,68,.15);color:var(--red)}
.v-mid{background:rgba(245,158,11,.15);color:var(--mid)}
.v-na{background:rgba(138,148,166,.15);color:var(--mut)}
.facto .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.facto p{margin:2px 0 0;font-size:17px;line-height:1.4}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.src a{font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 11px}

/* Barra inferior */
footer{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 16px calc(var(--sab) + 14px);border-top:1px solid var(--line);background:var(--bg)}
#status{min-height:20px;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
#status.err{color:var(--red)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:spin .8s linear infinite}
#btn{width:76px;height:76px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 24px rgba(47,124,246,.4);transition:transform .1s}
#btn:active{transform:scale(.94)}
#btn.on{background:var(--red);box-shadow:0 0 0 0 rgba(239,68,68,.5);animation:pulse 1.6s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
@media (min-width:700px){.wrap{padding-top:20px}.facto p{font-size:18px}}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <img src="/icons/icon-192.png" alt="">
  <h1>Facto</h1>
  <p>Ingresa tu código de acceso</p>
  <form id="gform" autocomplete="off">
    <input id="code" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Código" enterkeyhint="go">
    <button class="go" id="enter" type="submit">Entrar</button>
  </form>
  <div class="err" id="gerr"></div>
</div>

<div id="app" hidden>
  <header>
    <img src="/icons/icon-192.png" alt="">
    <b>Facto <small style="font-weight:400;font-size:11px;color:var(--mut)">v7</small></b>
    <button class="ib" id="out" aria-label="Cerrar sesión">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
    </button>
  </header>
  <main>
    <div class="wrap">
      <div id="sessions"></div>
      <div class="empty" id="empty">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        Toca el micrófono y habla.<br>Facto verifica los datos que se digan.
      </div>
    </div>
  </main>
  <footer>
    <div id="status"></div>
    <div id="dbg" style="font-size:11px;color:var(--mut);min-height:14px;text-align:center"></div>
    <button id="btn" aria-label="Escuchar"></button>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const I = {
  mic: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop: '<svg width="28" height="28" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  trash: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};
const store = {
  get(){ try{ return localStorage.getItem("k") || ""; }catch(_){ return ""; } },
  set(v){ try{ localStorage.setItem("k", v); }catch(_){} },
  del(){ try{ localStorage.removeItem("k"); }catch(_){} }
};
let rec = null, listening = false, buffer = [], busy = false, recent = [], cur = null, nSess = 0;

function setStatus(t, kind){
  const s = $("status");
  s.className = kind === "err" ? "err" : "";
  s.textContent = "";
  if(kind === "busy"){ const d = document.createElement("span"); d.className = "spin"; s.appendChild(d); }
  s.appendChild(document.createTextNode(t || ""));
}

/* ---- Acceso ---- */
function showGate(msg){
  $("app").hidden = true; $("gate").hidden = false;
  $("gerr").textContent = msg || "";
}
function showApp(){
  $("gate").hidden = true; $("app").hidden = false;
  $("btn").innerHTML = I.mic; updateEmpty();
}
$("gform").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const v = $("code").value.trim(); if(!v) return;
  $("gerr").textContent = ""; $("enter").disabled = true;
  try{
    const r = await fetch("/api/check", {method:"POST", headers:{"x-access-code": v}});
    if(r.ok){ store.set(v); $("code").value = ""; showApp(); }
    else $("gerr").textContent = "Código incorrecto";
  }catch(_){ $("gerr").textContent = "Sin conexión con el servidor"; }
  $("enter").disabled = false;
});
$("out").addEventListener("click", ()=>{ if(listening) stop(); store.del(); showGate(); });

/* ---- Escucha ---- */
function newSession(){
  nSess++;
  const el = document.createElement("section"); el.className = "sess live";
  const sh = document.createElement("div"); sh.className = "sh";
  const st = document.createElement("span"); st.className = "st";
  st.textContent = "Escucha " + nSess + " · " + new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  const del = document.createElement("button"); del.className = "ib"; del.setAttribute("aria-label","Eliminar escucha"); del.innerHTML = I.trash;
  del.onclick = ()=>{ el.remove(); updateEmpty(); };
  sh.append(st, del);
  const tr = document.createElement("p"); tr.className = "tr";
  tr.onclick = ()=> tr.classList.toggle("open");
  const fin = document.createElement("span"), int = document.createElement("span");
  tr.append(fin, int);
  const cards = document.createElement("div"); cards.className = "cards";
  el.append(sh, tr, cards);
  $("sessions").prepend(el);
  cur = {el, fin, int, cards};
  recent = []; buffer = [];
  updateEmpty();
}
function updateEmpty(){ $("empty").hidden = $("sessions").children.length > 0; }

let recActive = false, dlog = [];
function dbg(t){ dlog.push(t); $("dbg").textContent = dlog.slice(-9).join(" › "); }
// Envía a verificar lo dicho sin esperar a que el navegador marque la frase como terminada.
function flushR(r){
  clearTimeout(r._tm);
  for(const i in r._open){
    const t = r._open[i], from = r._sent[i] || 0;
    const piece = t.slice(from).trim();
    if(piece.split(/\s+/).length >= 6){ onFinal(piece); r._sent[i] = t.length; }
  }
}
function makeRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new SR();
  r.lang = "es-CL"; r.continuous = true; r.interimResults = true;
  r._sent = {}; r._open = {};
  r.onaudiostart = ()=>{
    dbg("audio");
    // Si en 7 s no hay voz ni texto (iOS a veces deja el micrófono mudo), reintenta una sola vez con un reconocedor nuevo.
    clearTimeout(r._wd);
    r._wd = setTimeout(()=>{
      if(r === rec && listening && !r._heard && !r._retried){
        dbg("sin voz: reintento");
        const n = makeRec(); n._retried = true; rec = n; recActive = false;
        try{ r.abort(); }catch(_){}
        setTimeout(()=>{ if(listening && rec === n){ try{ n.start(); }catch(_){} } }, 400);
      }
    }, 7000);
  };
  r.onsoundstart = ()=> dbg("sonido");
  r.onspeechstart = ()=>{ r._heard = true; dbg("voz"); };
  r.onnomatch = ()=> dbg("nomatch");
  r.onstart = ()=>{ dbg("onstart" + (r === rec ? "" : "(vieja)")); if(r === rec){ recActive = true; if(listening) setStatus("Escuchando…"); } };
  r.onresult = (e)=>{
    dbg("result" + (r === rec ? "" : "(vieja)"));
    r._heard = true;
    if(r !== rec || !cur) return;
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal){
        cur.fin.textContent += t + " ";
        onFinal(t.slice(r._sent[i] || 0).trim());
        delete r._open[i]; delete r._sent[i];
      } else {
        interim += t; r._open[i] = t;
        if(t.length - (r._sent[i] || 0) >= 140) flushR(r);
      }
    }
    cur.int.textContent = interim;
    clearTimeout(r._tm);
    if(Object.keys(r._open).length) r._tm = setTimeout(()=> flushR(r), 1800);
  };
  r.onerror = (e)=>{
    dbg("err:" + e.error);
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){ stop(); setStatus("Permiso de micrófono denegado", "err"); }
    else if(e.error !== "no-speech" && e.error !== "aborted") setStatus("Error de micrófono: " + e.error, "err");
  };
  r.onend = ()=>{
    dbg("onend" + (r === rec ? "" : "(vieja)"));
    if(r === rec) flushR(r);
    if(r === rec) recActive = false;
    // Reinicia si se corta solo, o arranca la escucha nueva que esperaba a que la anterior cerrara.
    if(listening){ try{ rec.start(); }catch(_){} }
  };
  return r;
}
function beginRec(){
  dbg("start()");
  try{ rec.start(); }
  catch(_){ dbg("start-falló"); setStatus("Preparando micrófono…"); }
  // Si en 2,5 s no arrancó (Safari a veces no cierra la escucha anterior), se recrea desde cero.
  setTimeout(()=>{
    if(listening && !recActive){
      dbg("recrear");
      rec = makeRec();
      try{ rec.start(); }catch(_){ setStatus("No se pudo iniciar el micrófono. Cierra y abre la app.", "err"); }
    }
  }, 2500);
}
function start(){
  if(!(window.SpeechRecognition || window.webkitSpeechRecognition)){
    setStatus("Este navegador no soporta reconocimiento de voz. Usa Safari o Chrome.", "err"); return;
  }
  const old = rec;
  rec = makeRec();
  newSession();
  listening = true;
  $("btn").innerHTML = I.stop; $("btn").className = "on"; $("btn").setAttribute("aria-label","Detener");
  setStatus("Iniciando…");
  recActive = false;
  if(old){ try{ old.abort(); }catch(_){} }
  beginRec();
}
function stop(){
  dbg("stop()");
  listening = false;
  if(rec){ flushR(rec); clearTimeout(rec._wd); try{ rec.abort(); }catch(_){} }
  if(cur){ cur.el.classList.remove("live"); cur.el.classList.toggle("mute", !(cur.fin.textContent + cur.int.textContent).trim()); }
  $("btn").innerHTML = I.mic; $("btn").className = ""; $("btn").setAttribute("aria-label","Escuchar");
  setStatus("");
}
$("btn").addEventListener("click", ()=> listening ? stop() : start());

/* ---- Verificación ---- */
const HAS_DATA = /\d|%|por\s*ciento|millon|mill[oó]n|\bmil\b/i;
function onFinal(text){
  if(text.split(/\s+/).length < 6) return;
  recent.push(text); if(recent.length > 4) recent.shift();
  if(!HAS_DATA.test(text)) return; // ahorra verificaciones: sin cifras/fechas/porcentajes no se envía
  buffer.push(text);
  drain();
}
async function drain(){
  if(busy || !buffer.length) return;
  const code = store.get();
  if(!code){ showGate("Ingresa tu código de acceso"); buffer = []; return; }
  busy = true;
  const sess = cur;
  const chunk = buffer.join(" "); buffer = [];
  setStatus("Verificando…", "busy");
  try{
    const r = await fetch("/api/verify", {
      method:"POST",
      headers:{"content-type":"application/json", "x-access-code": code},
      body: JSON.stringify({chunk: chunk, context: recent.slice(0,-1).join(" ")})
    });
    const j = await r.json().catch(()=>({}));
    if(r.status === 401){ if(listening) stop(); store.del(); showGate("El código ya no es válido"); busy = false; return; }
    if(!r.ok){ setStatus("Error: " + (j.detail || r.status), "err"); busy = false; return; }
    if(j.card) addCard(sess, j.card);
    else if(j.why && j.why !== "nada") dbg("sin tarjeta: " + j.why + " [" + (j.stop||"") + "] " + (j.raw||"").slice(0,80));
    else dbg("modelo: sin datos");
    setStatus(listening ? "Escuchando…" : "");
  }catch(e){
    setStatus("Error: " + e.message, "err");
  }
  busy = false;
  drain();
}

function verdictClass(v){
  v = (v || "").toLowerCase();
  if(v.includes("incorrecto")) return "v-bad";
  if(v.includes("correcto")) return "v-ok";
  if(v.includes("impreciso")) return "v-mid";
  return "v-na";
}
function addCard(sess, c){
  const d = document.createElement("article"); d.className = "card";
  const x = document.createElement("button"); x.className = "x"; x.setAttribute("aria-label","Eliminar"); x.innerHTML = I.x;
  x.onclick = ()=> d.remove();
  const claim = document.createElement("p"); claim.className = "claim"; claim.textContent = "“" + c.afirmacion + "”";
  const pill = document.createElement("span"); pill.className = "pill " + verdictClass(c.veredicto); pill.textContent = c.veredicto;
  const f = document.createElement("div"); f.className = "facto";
  const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "Facto";
  const p = document.createElement("p"); p.textContent = c.facto;
  f.append(lbl, p);
  d.append(x, claim, pill, f);
  if((c.fuentes || []).length){
    const s = document.createElement("div"); s.className = "src";
    for(const u of c.fuentes){
      const a = document.createElement("a"); a.href = u.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = u.name;
      s.appendChild(a);
    }
    d.appendChild(s);
  }
  sess.cards.prepend(d);
}

/* ---- Inicio ---- */
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
store.get() ? showApp() : showGate();
</script>
</body>
</html>
